[package]
name = "compasso"
version = "0.1.0"
description = "Pomodoro, Kanban e estatísticas de foco para Windows"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "compasso_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `bundled` compila o SQLite junto: nenhuma DLL externa, mesma versão em toda máquina.
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# Cliente HTTP da previsão do tempo — a única funcionalidade que usa a rede.
ureq = "3"

[target.'cfg(windows)'.dependencies]
# Som de aviso (PlaySoundW) e caixa de erro na inicialização (MessageBoxW).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
] }
# APIs do Windows para as abas do notch: controle de mídia e volume (media/)
# e serviço de localização (weather/location.rs).
windows = { version = "0.62", features = [
    "Devices_Geolocation",
    "Foundation",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
